<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Activ Paisa — main page tests</title>
<style>
  body { font: 14px/1.6 ui-monospace, Menlo, monospace; padding: 20px; }
  iframe { width: 1200px; height: 800px; border: 1px solid #ccc; position: fixed; right: 20px; top: 20px; }
  li { list-style: none; }
  .pass::before { content: "PASS  "; color: #059669; font-weight: 700; }
  .fail::before { content: "FAIL  "; color: #DC2626; font-weight: 700; }
  #summary { font-weight: 700; margin-top: 14px; font-size: 16px; }
</style>
</head>
<body>
<h1>Main page tests (personal loan)</h1>
<ul id="results"></ul>
<p id="summary">running…</p>
<iframe id="app" src="../index.html" title="Personal loan page under test"></iframe>

<script>
/* Drives the main page: company sections, product widgets and the full
   application flow through to the offers screen. Run: npm test */
(function () {
  var out = document.getElementById('results');
  var pass = 0, fail = 0;

  function ok(cond, label) {
    var li = document.createElement('li');
    li.className = cond ? 'pass' : 'fail';
    li.textContent = label;
    out.appendChild(li);
    cond ? pass++ : fail++;
  }
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  function waitFor(fn, timeout) {
    timeout = timeout || 8000;
    var start = Date.now();
    return new Promise(function (resolve, reject) {
      (function poll() {
        var v; try { v = fn(); } catch (e) { v = null; }
        if (v) return resolve(v);
        if (Date.now() - start > timeout) return reject(new Error('timeout'));
        setTimeout(poll, 50);
      })();
    });
  }
  function fire(n, t) { n.dispatchEvent(new Event(t, { bubbles: true })); }
  function set(d, sel, v) { var i = d.querySelector(sel); i.value = v; fire(i, 'input'); fire(i, 'blur'); return i; }
  function pick(d, name, v) {
    var r = d.querySelector('input[name="' + name + '"][value="' + v + '"]');
    r.checked = true; fire(r, 'change');
  }
  function choose(d, name, v) { var s = d.querySelector('[name="' + name + '"]'); s.value = v; fire(s, 'change'); }
  function visibleStep(d) {
    if (d.querySelector('.flow-done:not([hidden])')) return 'done';
    var s = d.querySelector('.flow-step:not([hidden])');
    if (!s) return -1;
    return s.dataset.step === undefined ? 'offers' : Number(s.dataset.step);
  }
  function submitStep(d) {
    d.querySelector('.flow-step:not([hidden])').querySelector('button[type="submit"]').click();
  }
  function money(s) { return parseInt(String(s).replace(/\D/g, ''), 10); }

  var frame = document.getElementById('app');

  frame.addEventListener('load', function () {
    var d = frame.contentDocument, w = frame.contentWindow;

    (async function run() {
      try {
        /* ================= landing ================= */
        var realCards = d.querySelectorAll('#partnerTrack .partner-card:not([aria-hidden])');
        ok(realCards.length === 15, 'renders all 15 lending partner cards (' + realCards.length + ')');
        ok(d.querySelectorAll('#partnerTrack .partner-card[aria-hidden]').length === 15,
           'clones the partner track so the auto-scroll wraps seamlessly');
        ok(d.querySelector('#partnerTrack').textContent.indexOf('HDFC Bank Limited') > -1,
           'partner cards carry the confirmed lender names');
        ok(d.querySelectorAll('#partnerTrack .p-logo img').length > 0,
           'partner cards render the supplied lender logos');
        ok(d.querySelectorAll('#partnerTrack .p-grievance').length > 0,
           'every partner card links to grievance redressal');
        ok(d.querySelectorAll('#dlaGrid .dla-card').length === 2,
           'renders 2 digital lending partner cards');
        ok(d.querySelectorAll('#reviewTrack .review-card:not([aria-hidden])').length === 3,
           'renders 3 review cards');
        ok(d.querySelectorAll('#app .store-badge').length === 2 &&
           d.querySelector('#app').textContent.indexOf('Coming soon') > -1,
           'app section shows both stores as coming soon');
        ok(d.querySelectorAll('.grievance-bar a').length === 2,
           'grievance links bar sits below the partner carousel');


        /* ---- the main page keeps only the hero, partners, reviews, app
               and support; calculators and FAQ live on the product pages ---- */
        ok(d.querySelectorAll('.odometer .odo-col').length === 2,
           'builds a 2-digit odometer for the hero amount');
        ok(d.querySelector('#stickyCta') !== null, 'sticky apply bar is present');
        var navHrefs = [].map.call(d.querySelectorAll('#headerNav a, .footer-col a'),
          function (a) { return a.getAttribute('href'); });
        ok(navHrefs.indexOf('business-loan.html') > -1 && navHrefs.indexOf('home-loan.html') > -1,
           'navigation reaches the business and home loan pages');

        ['#emiCalc', '#eligCalc', '#compareGrid', '#docList', '.faq-item', '.benefit-card']
          .forEach(function (sel) {
            ok(d.querySelector(sel) === null, 'main page carries no ' + sel);
          });
        ok(d.querySelector('script[type="application/ld+json"]') === null,
           'no FAQ schema is claimed without the questions on the page');

        /* ---- carousels ----
           Headless produces no animation frames, so a smooth scroll never
           progresses; force instant scrolling to observe the advance. */
        var st = d.createElement('style');
        st.textContent = '.car-track{scroll-behavior:auto !important}';
        d.head.appendChild(st);
        var pTrack = d.querySelector('#partnerTrack');
        var pCar = d.querySelector('#partners [data-carousel]');
        var startP = pTrack.scrollLeft;
        await wait(7000);
        ok(pTrack.scrollLeft > startP, 'partner carousel advances on its own');
        ok(pTrack.scrollLeft <= pTrack.scrollWidth / 2 + 2,
           'partner carousel wraps within the cloned half');
        pCar.querySelector('[data-car-pause]').click();
        var atPause = pTrack.scrollLeft;
        await wait(7000);
        ok(Math.abs(pTrack.scrollLeft - atPause) < 2, 'pause control stops the advance');


        /* ---- computed-style guards ---- */
        function styled(sel, prop, reject) {
          var node = d.querySelector(sel);
          return node ? w.getComputedStyle(node)[prop] !== reject : false;
        }
        ok(styled('.store-badge', 'borderTopWidth', '0px'), 'store badges are styled');
        ok(w.getComputedStyle(d.querySelector('.store-badge span')).flexDirection === 'column',
           'store badge stacks its platform label above the status');
        ok(styled('.partner-card', 'borderRightWidth', '0px'), 'partner columns keep their divider');
        ok(styled('.review-card', 'borderTopWidth', '0px'), 'review cards are styled');
        ok(styled('.footer-main', 'backgroundColor', 'rgba(0, 0, 0, 0)'), 'footer is styled');

        /* ---- images ---- */
        var art = [].slice.call(d.querySelectorAll(
          '.p-logo img, .avatar img, .hero-art img, .app-art img, .brand-logo, .footer-logo'));
        ok(art.length >= 20, 'logo, avatar and illustration images render (' + art.length + ')');
        var broken = art.filter(function (n) { return n.complete && n.naturalWidth === 0; });
        ok(broken.length === 0, 'every image resolves');
        ok(art.every(function (n) { return n.hasAttribute('alt'); }), 'every image carries alt text');

        /* ================= application flow ================= */
        ok(d.querySelector('#applyView').hidden === true, 'application view starts hidden');
        d.querySelector('[data-open-apply]').click();
        await wait(60);
        ok(d.querySelector('#applyView').hidden === false && d.querySelector('#main').hidden === true,
           'Check Offers replaces the landing page with the application');
        ok(w.getComputedStyle(d.querySelector('#stickyCta')).display === 'none',
           'sticky apply bar is hidden while the application is open');
        ok(visibleStep(d) === 0, 'starts on the mobile step');

        /* 1. mobile */
        set(d, '#flowMobile', '12345');
        submitStep(d);
        await wait(1300);
        ok(d.querySelector('#flowMobile').closest('.field').classList.contains('has-error'),
           'rejects a short mobile number');
        ok(visibleStep(d) === 0, 'does not advance on an invalid mobile');

        set(d, '#flowMobile', '9876543210');
        submitStep(d);
        await wait(1300);
        ok(d.querySelector('#flowConsent').closest('.field').classList.contains('has-error'),
           'requires the consent checkbox');
        ok(visibleStep(d) === 0, 'does not advance without consent');

        var consent = d.querySelector('#flowConsent');
        consent.checked = true; fire(consent, 'change');
        submitStep(d);
        await waitFor(function () { return visibleStep(d) === 1; });
        ok(true, 'mobile + consent advances straight to OTP');

        /* 2. OTP */
        ok(d.querySelector('#flowResend').disabled, 'resend is disabled while the timer runs');
        submitStep(d);
        await wait(80);
        ok(d.querySelector('#otp0').closest('.field').classList.contains('has-error'),
           'rejects an incomplete OTP');
        var boxes = d.querySelectorAll('#flowOtp input');
        for (var i = 0; i < boxes.length; i++) { boxes[i].value = String(i + 1); fire(boxes[i], 'input'); }
        submitStep(d);
        await waitFor(function () { return visibleStep(d) === 2; });
        ok(true, 'a complete OTP advances to personal details');

        /* 3. basic details */
        ok(d.querySelectorAll('.stepper li').length === 3, 'three-node stepper appears');
        ok(d.querySelectorAll('.stepper li')[0].classList.contains('is-current'),
           'stepper marks Basic Details as current');

        set(d, '[name="pan"]', 'BADPAN');
        submitStep(d);
        await wait(80);
        ok(d.querySelector('[name="pan"]').closest('.field').classList.contains('has-error'),
           'rejects a malformed PAN');
        ok(visibleStep(d) === 2, 'does not advance on invalid basic details');

        set(d, '[name="email"]', 'not-an-email');
        await wait(60);
        ok(d.querySelector('[name="email"]').closest('.field').classList.contains('has-error'),
           'rejects a malformed email');

        set(d, '[name="pincode"]', '012345');
        await wait(60);
        ok(d.querySelector('[name="pincode"]').closest('.field').classList.contains('has-error'),
           'rejects a pincode starting with zero');

        pick(d, 'gender', 'Female');
        set(d, '[name="email"]', 'anita@example.com');
        set(d, '[name="dob"]', '1990-04-12');
        set(d, '[name="pincode"]', '411001');
        set(d, '[name="pan"]', 'ABCDE1234F');
        submitStep(d);
        await waitFor(function () { return visibleStep(d) === 3; });
        ok(true, 'advances to income details');
        ok(d.querySelectorAll('.stepper li')[0].classList.contains('is-done'),
           'stepper marks Basic Details as done');
        ok(d.querySelectorAll('.stepper li')[1].classList.contains('is-current'),
           'stepper marks Income Details as current');

        /* 4. income details */
        set(d, '[name="income"]', '10000');
        submitStep(d);
        await wait(80);
        ok(d.querySelector('[name="income"]').closest('.field').classList.contains('has-error'),
           'rejects monthly income below the minimum');

        pick(d, 'employment', 'Salaried');
        set(d, '[name="company"]', 'Example Technologies');
        set(d, '[name="income"]', '300000');
        ok(d.querySelector('[name="income"]').value === '3,00,000',
           'money fields use Indian digit grouping');
        ok(d.querySelector('[name="household"]').value === '36,00,000',
           'annual household income derives from monthly income (x12)');

        set(d, '[name="household"]', '200000');
        submitStep(d);
        await wait(80);
        ok(d.querySelector('[name="household"]').closest('.field').classList.contains('has-error'),
           'rejects household income below the applicant own annual income');

        set(d, '[name="household"]', '5000000');
        submitStep(d);
        await wait(80);
        ok(d.querySelector('#f_declResident').closest('.field').classList.contains('has-error'),
           'requires the residency declaration');
        ok(visibleStep(d) === 3, 'does not advance without the declarations');

        var d1 = d.querySelector('#f_declResident'), d2 = d.querySelector('#f_declIndustry');
        d1.checked = true; fire(d1, 'change');
        d2.checked = true; fire(d2, 'change');

        /* 5. confirmation — no lender offers are shown */
        submitStep(d);
        await waitFor(function () { return visibleStep(d) === 'done'; });
        ok(true, 'Get Offer Now reaches the confirmation screen');
        ok(d.querySelector('#flowOffers') === null, 'no lender offers are displayed');
        ok(d.querySelector('.done-callout strong').textContent
             .indexOf('agent will call you within 24 hours') > -1,
           'confirmation leads with the 24-hour callback promise');
        ok(d.querySelectorAll('.done-next li').length === 3, 'confirmation lists what happens next');
        ok(/^AP-\d{4}-/.test(d.querySelector('#flowRef').textContent),
           'confirmation shows a reference code (' + d.querySelector('#flowRef').textContent + ')');
        ok(d.querySelectorAll('.stepper li')[2].classList.contains('is-current'),
           'stepper marks the final node as current');
        ok(d.querySelector('.stepper li:last-child').textContent.indexOf('Approved Offer') === -1,
           'final stepper node does not claim an offer was approved');

        /* ---- brand and placeholder guards ---- */
        var html = d.documentElement.outerHTML.toLowerCase();
        ok(html.indexOf('moneycontrol') === -1, 'no "moneycontrol" reference remains');
        ok(html.indexOf('livemint') === -1 && html.indexOf('mint money') === -1,
           'no "livemint" / "mint money" reference remains');
        ok(html.indexOf('nw18') === -1 && html.indexOf('network18') === -1,
           'no Network18 reference remains');
        ok(html.indexOf('googletagmanager') === -1, 'no third-party analytics remains');

        var text = d.body.innerText || d.body.textContent;
        ok(['To be published', 'to be provided', '[name]', 'Lorem ipsum', 'TODO']
             .every(function (t) { return text.indexOf(t) === -1; }),
           'no placeholder text is visible');

      } catch (e) {
        ok(false, 'unexpected error: ' + e.message);
      }

      var s = document.getElementById('summary');
      s.textContent = pass + ' passed, ' + fail + ' failed';
      s.style.color = fail ? '#DC2626' : '#059669';
      document.title = fail ? 'FAIL' : 'PASS';
    })();
  });
})();
</script>
</body>
</html>
