<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Activ Paisa — flow tests</title>
<style>
  body { font: 14px/1.6 ui-monospace, Menlo, monospace; padding: 20px; }
  iframe { width: 420px; height: 700px; border: 1px solid #ccc; position: fixed; right: 20px; top: 20px; }
  li { list-style: none; }
  .pass::before { content: "PASS  "; color: #059669; font-weight: 700; }
  .fail::before { content: "FAIL  "; color: #DC2626; font-weight: 700; }
  #summary { font-weight: 700; margin-top: 14px; font-size: 16px; }
</style>
</head>
<body>
<h1>Flow tests</h1>
<ul id="results"></ul>
<p id="summary">running…</p>
<iframe id="app" src="../index.html" title="App under test"></iframe>

<script>
/* Integration test: drives the real application in an iframe.
   Run:  npm test        (or open this file over http://) */
(function () {
  var out = document.getElementById('results');
  var pass = 0, fail = 0;

  function ok(cond, label) {
    var li = document.createElement('li');
    li.className = cond ? 'pass' : 'fail';
    li.textContent = label;
    out.appendChild(li);
    cond ? pass++ : fail++;
  }

  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  function waitFor(fn, timeout) {
    timeout = timeout || 5000;
    var start = Date.now();
    return new Promise(function (resolve, reject) {
      (function poll() {
        var v;
        try { v = fn(); } catch (e) { v = null; }
        if (v) return resolve(v);
        if (Date.now() - start > timeout) return reject(new Error('timeout'));
        setTimeout(poll, 50);
      })();
    });
  }

  function fire(node, type) { node.dispatchEvent(new Event(type, { bubbles: true })); }

  function type(doc, sel, value) {
    var input = doc.querySelector(sel);
    input.value = value;
    fire(input, 'input');
    fire(input, 'blur');
    return input;
  }

  function pick(doc, name, value) {
    var radio = doc.querySelector('input[name="' + name + '"][value="' + value + '"]');
    radio.checked = true;
    fire(radio, 'change');
  }

  function visibleStep(doc) {
    var s = doc.querySelector('.step:not([hidden])');
    return s ? Number(s.dataset.step) : -1;
  }

  function submit(doc, formSel) {
    doc.querySelector(formSel).querySelector('button[type="submit"]').click();
  }

  var frame = document.getElementById('app');

  frame.addEventListener('load', function () {
    var doc = frame.contentDocument;

    (async function run() {
      try {
        /* ---- Landing page ---- */
        var realCards = doc.querySelectorAll('#partnerTrack .partner-card:not([aria-hidden])');
        ok(realCards.length === 15, 'renders all 15 lending partner cards (' + realCards.length + ')');
        ok(doc.querySelectorAll('#partnerTrack .partner-card[aria-hidden]').length === 15,
           'clones the partner track so the auto-scroll wraps seamlessly');
        ok(doc.querySelector('#partnerTrack').textContent.indexOf('HDFC Bank Limited') > -1,
           'partner cards carry the confirmed lender names');
        ok(doc.querySelectorAll('#partnerTrack .p-logo img').length > 0,
           'partner cards render the supplied lender logos');
        ok(doc.querySelectorAll('#partnerTrack .p-grievance').length > 0,
           'every partner card links to grievance redressal');

        /* nothing on the page should read as unfinished copy */
        var pageText = doc.body.innerText || doc.body.textContent;
        var leftovers = ['To be published', 'to be provided', '[name]',
                         'registered entity name', 'Lorem ipsum', 'TODO']
          .filter(function (t) { return pageText.indexOf(t) > -1; });
        ok(leftovers.length === 0,
           'no placeholder text is visible' + (leftovers.length ? ' — found: ' + leftovers.join(', ') : ''));
        ok(doc.querySelectorAll('#partnerTrack .partner-card[aria-hidden] a[tabindex="-1"]').length > 0,
           'clones are taken out of the tab order');
        ok(doc.querySelectorAll('#dlaGrid .dla-card').length === 2,
           'renders 2 digital lending partner cards');
        ok(doc.querySelectorAll('#reviewTrack .review-card:not([aria-hidden])').length === 3,
           'renders 3 review cards');
        ok(doc.querySelectorAll('#reviewTrack .review-card .quote-rule').length > 0,
           'review cards carry the quote-and-rule header');
        ok(doc.querySelectorAll('[data-carousel][data-autoscroll] [data-car-pause]').length === 2,
           'both auto-scrolling carousels expose a pause control');
        ok(doc.querySelectorAll('.grievance-bar a').length === 2,
           'grievance links bar sits below the partner carousel');

        /* ---- auto-advancing carousels ----
           Headless produces no animation frames, so a smooth scroll never
           progresses; force instant scrolling to observe the advance itself. */
        var st = doc.createElement('style');
        st.textContent = '.car-track{scroll-behavior:auto !important}';
        doc.head.appendChild(st);

        var pTrack = doc.querySelector('#partnerTrack');
        var rTrack = doc.querySelector('#reviewTrack');
        var pCar = doc.querySelector('#partners [data-carousel]');
        var startP = pTrack.scrollLeft, startR = rTrack.scrollLeft;

        await wait(7000);
        ok(pTrack.scrollLeft > startP, 'partner carousel advances on its own');
        ok(rTrack.scrollLeft > startR, 'review carousel advances on its own');
        ok(pTrack.scrollLeft <= pTrack.scrollWidth / 2 + 2,
           'partner carousel wraps within the cloned half rather than running off the end');

        pCar.querySelector('[data-car-pause]').click();
        var atPause = pTrack.scrollLeft;
        await wait(7000);
        ok(Math.abs(pTrack.scrollLeft - atPause) < 2, 'pause control stops the advance');
        ok(pCar.classList.contains('is-paused'), 'paused carousel is flagged for the icon swap');
        ok(doc.querySelectorAll('.odometer .odo-col').length === 2,
           'builds a 2-digit odometer for the hero amount');
        ok(doc.querySelectorAll('#app .store-badge').length === 2 &&
           doc.querySelector('#app').textContent.indexOf('Coming soon') > -1,
           'app section shows both stores as coming soon');

        /* Computed-style guards. A deleted CSS block still passes every
           markup-only assertion, so check the key components are actually
           styled, not merely present. */
        var w = frame.contentWindow;
        function styled(sel, prop, reject) {
          var node = doc.querySelector(sel);
          if (!node) return false;
          return w.getComputedStyle(node)[prop] !== reject;
        }
        ok(styled('.store-badge', 'borderTopWidth', '0px'), 'store badges are styled');

        /* artwork actually resolves — a broken src leaves naturalWidth at 0 */
        var art = [].slice.call(doc.querySelectorAll(
          '.p-logo img, .avatar img, .hero-art img, .app-art img, .brand-logo, .footer-logo'));
        ok(art.length >= 8, 'logo, avatar and illustration images are all rendered (' + art.length + ')');
        var broken = art.filter(function (n) { return n.complete && n.naturalWidth === 0; });
        ok(broken.length === 0,
           'every image resolves' + (broken.length ? ' — broken: ' + broken.map(function (n) {
             return n.getAttribute('src'); }).join(', ') : ''));
        ok(art.every(function (n) { return n.hasAttribute('alt'); }),
           'every image carries an alt attribute');
        ok(doc.querySelectorAll('.avatar img[loading="lazy"]').length > 0,
           'avatar images are lazy-loaded');
        ok(w.getComputedStyle(doc.querySelector('.store-badge span')).flexDirection === 'column',
           'store badge stacks its platform label above the status');
        ok(styled('.partner-card', 'borderRightWidth', '0px'), 'partner columns keep their divider');
        ok(styled('.review-card', 'borderTopWidth', '0px'), 'review cards are styled');
        ok(styled('.capture-card', 'backgroundColor', 'rgba(0, 0, 0, 0)'),
           'application capture card is styled');
        ok(styled('.hl-icon', 'backgroundColor', 'rgba(0, 0, 0, 0)'), 'hero highlight icons are styled');
        ok(styled('.footer-main', 'backgroundColor', 'rgba(0, 0, 0, 0)'), 'footer is styled');

        var footer = doc.querySelector('.site-footer').textContent;
        ok(doc.querySelectorAll('.footer-col').length === 2,
           'footer has the Company and Digital Lending columns');
        ok(footer.indexOf('Digital Lending') > -1 &&
           footer.indexOf('Grievance Redressal') > -1,
           'footer carries the Digital Lending links');
        ok(footer.indexOf('Statutory Information') === -1 &&
           footer.indexOf('Investor Charter') === -1 &&
           footer.indexOf('Investor Complaints') === -1,
           'footer omits the statutory / investor-complaint columns');
        ok(footer.indexOf('SEBI') === -1 && footer.indexOf('BASL') === -1 &&
           footer.indexOf('securities market') === -1,
           'footer makes no SEBI, BASL or securities-market claim');
        ok(doc.querySelector('#applyView').hidden === true,
           'application view starts hidden');

        /* ---- Enter the flow ---- */
        doc.querySelector('[data-open-apply]').click();
        await wait(80);
        ok(doc.querySelector('#applyView').hidden === false &&
           doc.querySelector('#main').hidden === true,
           'Check Offers replaces the landing page with the application view');

        /* ---- Step 1: mobile validation ---- */
        ok(visibleStep(doc) === 0, 'starts on the mobile step');

        type(doc, '#mobile', '12345');
        submit(doc, '#formMobile');
        await wait(60);
        ok(doc.querySelector('#mobile').closest('.field').classList.contains('has-error'),
           'rejects a short mobile number');
        ok(visibleStep(doc) === 0, 'does not advance on an invalid mobile');

        type(doc, '#mobile', '1234567890');
        submit(doc, '#formMobile');
        await wait(60);
        ok(doc.querySelector('#mobile').closest('.field').classList.contains('has-error'),
           'rejects a mobile not starting 6-9');

        type(doc, '#mobile', '9876543210');
        submit(doc, '#formMobile');
        // wait past the simulated submit delay, or a false advance looks like a pass
        await wait(1400);
        ok(doc.querySelector('#consent').closest('.field').classList.contains('has-error'),
           'requires the consent checkbox');
        ok(visibleStep(doc) === 0, 'does not advance without consent');

        var consent = doc.querySelector('#consent');
        consent.checked = true;
        fire(consent, 'change');
        submit(doc, '#formMobile');
        await waitFor(function () { return visibleStep(doc) === 1; });
        ok(true, 'mobile + consent advances straight to OTP');
        ok(doc.querySelector('#stepper').hidden,
           'stepper stays hidden on the mobile and OTP screens');

        /* ---- Step 2: OTP ---- */
        var target = doc.querySelector('#otpTarget').textContent;
        ok(target.indexOf('XXXXX') > -1 && target.indexOf('9876543210') === -1,
           'masks the mobile number on the OTP screen');
        ok(doc.querySelector('#resendBtn').disabled, 'resend is disabled while the timer runs');

        submit(doc, '#formOtp');
        await wait(60);
        ok(doc.querySelector('#otp-0').closest('.field').classList.contains('has-error'),
           'rejects an incomplete OTP');
        ok(visibleStep(doc) === 1, 'does not advance on an incomplete OTP');

        var boxes = doc.querySelectorAll('#otpInputs input');
        for (var i = 0; i < boxes.length; i++) {
          boxes[i].value = String(i + 1);
          fire(boxes[i], 'input');
        }
        submit(doc, '#formOtp');
        await waitFor(function () { return visibleStep(doc) === 2; });
        ok(true, 'a complete OTP advances to basic details');
        ok(!doc.querySelector('#stepper').hidden, 'stepper appears from basic details');
        ok(doc.querySelectorAll('#stepperList li').length === 3, 'stepper has 3 nodes');
        ok(doc.querySelectorAll('#stepperList li')[0].classList.contains('is-current'),
           'stepper marks Basic Details as current');

        /* ---- Step 3: basic details ---- */
        type(doc, '#pan', 'BADPAN123');
        submit(doc, '#formBasic');
        await wait(60);
        ok(doc.querySelector('#pan').closest('.field').classList.contains('has-error'),
           'rejects a malformed PAN');
        ok(visibleStep(doc) === 2, 'does not advance on an invalid PAN');

        type(doc, '#email', 'not-an-email');
        submit(doc, '#formBasic');
        await wait(60);
        ok(doc.querySelector('#email').closest('.field').classList.contains('has-error'),
           'rejects a malformed email');

        type(doc, '#pincode', '012345');
        await wait(60);
        ok(doc.querySelector('#pincode').closest('.field').classList.contains('has-error') ||
           doc.querySelector('#pincode').value === '012345',
           'rejects a pincode starting with 0');

        pick(doc, 'gender', 'Female');
        type(doc, '#dob', '1996-01-15');
        type(doc, '#email', 'test@example.com');
        type(doc, '#pincode', '560001');
        type(doc, '#pan', 'ABCDE1234F');
        submit(doc, '#formBasic');
        await waitFor(function () { return visibleStep(doc) === 3; });
        ok(true, 'advances to income details with valid basic details');
        ok(doc.querySelectorAll('#stepperList li')[0].classList.contains('is-done'),
           'stepper marks Basic Details as done');
        ok(doc.querySelectorAll('#stepperList li')[1].classList.contains('is-current'),
           'stepper marks Income Details as current');

        /* ---- Step 4: income details ---- */
        type(doc, '#income', '10000');
        submit(doc, '#formEmployment');
        await wait(60);
        ok(doc.querySelector('#income').closest('.field').classList.contains('has-error'),
           'rejects monthly income below the minimum');

        pick(doc, 'employment', 'Self-employed');
        ok(doc.querySelector('#companyLabel').textContent === 'Business Name*',
           'relabels company field for self-employed applicants');
        pick(doc, 'employment', 'Salaried');

        type(doc, '#company', 'Example Technologies Pvt Ltd');
        type(doc, '#income', '3,00,000');
        ok(doc.querySelector('#income').value === '3,00,000', 'formats income with Indian digit grouping');
        ok(doc.querySelector('#household').value === '36,00,000',
           'derives annual household income from monthly income (x12)');

        // clearing it by hand stops the derivation taking over again
        type(doc, '#household', '');
        type(doc, '#income', '3,00,000');
        ok(doc.querySelector('#household').value === '',
           'stops deriving once household income is edited by hand');

        submit(doc, '#formEmployment');
        await wait(60);
        ok(doc.querySelector('#household').closest('.field').classList.contains('has-error'),
           'requires an annual household income');
        ok(visibleStep(doc) === 3, 'does not advance without household income');

        type(doc, '#household', '200000');
        ok(doc.querySelector('#household').value === '2,00,000',
           'formats household income with Indian digit grouping');
        submit(doc, '#formEmployment');
        await wait(60);
        ok(doc.querySelector('#household').closest('.field').classList.contains('has-error'),
           'rejects household income below the applicant\u2019s own annual income');

        type(doc, '#household', '5000000');
        submit(doc, '#formEmployment');
        await wait(60);
        ok(doc.querySelector('#declResident').closest('.field').classList.contains('has-error'),
           'requires the residency / politically-exposed declaration');
        ok(visibleStep(doc) === 3, 'does not advance without the declarations');

        var d1 = doc.querySelector('#declResident'), d2 = doc.querySelector('#declIndustry');
        d1.checked = true; fire(d1, 'change');
        d2.checked = true; fire(d2, 'change');
        submit(doc, '#formEmployment');
        await waitFor(function () { return visibleStep(doc) === 4; });
        ok(true, 'advances to the approved offer');
        ok(doc.querySelectorAll('#stepperList li')[2].classList.contains('is-current'),
           'stepper marks Approved Offer as current');

        /* ---- Step 5: offers ---- */
        ok(doc.querySelectorAll('#offers .skeleton').length === 3, 'shows 3 skeleton loaders while fetching');

        var cards = await waitFor(function () {
          var c = doc.querySelectorAll('#offers .offer');
          return c.length === 3 ? c : null;
        });
        ok(true, 'renders 3 partner offers');

        var names = Array.prototype.map.call(cards, function (c) {
          return c.querySelector('.offer-name').textContent;
        });
        ok(names.join('|') === 'Bank Partner 1|Bank Partner 2|Bank Partner 3',
           'offers use placeholder partner names');

        var figures = cards[0].querySelectorAll('.offer-figures dd');
        var amount = parseInt(figures[0].textContent.replace(/\D/g, ''), 10);
        var emi = parseInt(figures[2].textContent.replace(/\D/g, ''), 10);
        // income 3,00,000 x 12 = 36,00,000, clamped to partner 1's 15,00,000 ceiling
        ok(amount === 1500000, 'clamps offer 1 to the partner ceiling (got ' + amount + ')');
        // EMI for 15,00,000 @ 10.99% over 36 months ~ 49,100
        ok(emi > 48000 && emi < 50500, 'EMI is arithmetically correct (got ' + emi + ')');

        cards[0].querySelector('button').click();
        await waitFor(function () { return visibleStep(doc) === 5; });
        ok(true, 'reaches the success screen after applying');
        ok(doc.querySelector('#successSub').textContent.indexOf('Bank Partner 1') > -1,
           'success message names the selected partner');

        /* ---- Restart ---- */
        doc.querySelector('#restartBtn').click();
        await waitFor(function () { return visibleStep(doc) === 0; });
        ok(doc.querySelector('#mobile').value === '', 'restart clears the form');

        doc.querySelector('#applyExit').click();
        await wait(80);
        ok(doc.querySelector('#applyView').hidden === true &&
           doc.querySelector('#main').hidden === false,
           'exit returns to the landing page');

        /* ---- No brand leakage ---- */
        var html = doc.documentElement.outerHTML.toLowerCase();
        ok(html.indexOf('moneycontrol') === -1, 'no "moneycontrol" reference remains');
        ok(html.indexOf('livemint') === -1 && html.indexOf('mint money') === -1,
           'no "livemint" / "mint money" reference remains');
        ok(html.indexOf('nw18') === -1 && html.indexOf('network18') === -1,
           'no Network18 reference remains');
        ok(html.indexOf('googletagmanager') === -1, 'no third-party analytics remains');

      } catch (e) {
        ok(false, 'unexpected error: ' + e.message);
      }

      var s = document.getElementById('summary');
      s.textContent = pass + ' passed, ' + fail + ' failed';
      s.style.color = fail ? '#DC2626' : '#059669';
      document.title = fail ? 'FAIL' : 'PASS';
    })();
  });
})();
</script>
</body>
</html>
