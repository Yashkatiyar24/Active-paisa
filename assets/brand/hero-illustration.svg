<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-label="A phone showing instant loan approval beside a stack of banknotes">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#472A8F"/>
      <stop offset="1" stop-color="#1E6BFF"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E7DFF"/>
      <stop offset="1" stop-color="#1E6BFF"/>
    </linearGradient>
    <linearGradient id="noteDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B3BA8"/>
      <stop offset="1" stop-color="#472A8F"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131C31"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1E6BFF" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1E3A8A" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect x="286" y="26" width="330" height="300" fill="url(#grid)" rx="8"/>
  <circle cx="470" cy="200" r="180" fill="#1E6BFF" opacity=".05"/>
  <ellipse cx="316" cy="486" rx="252" ry="30" fill="#0F172A" opacity=".07"/>

  <!-- phone -->
  <g filter="url(#soft)">
    <rect x="356" y="66" width="216" height="404" rx="34" fill="#0B1220"/>
    <rect x="366" y="76" width="196" height="384" rx="26" fill="url(#screen)"/>
    <rect x="440" y="86" width="48" height="9" rx="4.5" fill="#2A3448"/>

    <!-- screen content -->
    <text x="464" y="215" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif"
          font-size="27" font-weight="700" fill="#FFFFFF">Instant</text>
    <text x="464" y="249" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif"
          font-size="27" font-weight="700" fill="#5C9DFF">Loans</text>

    <!-- approved tick -->
    <circle cx="464" cy="310" r="30" fill="none" stroke="#3E7DFF" stroke-width="3" opacity=".45"/>
    <circle cx="464" cy="310" r="22" fill="url(#brand)"/>
    <path d="M455 310l6 7 12-14" fill="none" stroke="#fff" stroke-width="3.4"
          stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="404" y="362" width="120" height="9" rx="4.5" fill="#22304A"/>
    <rect x="424" y="382" width="80" height="9" rx="4.5" fill="#1A2439"/>
    <rect x="404" y="412" width="120" height="30" rx="15" fill="url(#brand)"/>
  </g>

  <!-- banknote stack -->
  <g filter="url(#soft)">
    <!-- bottom notes -->
    <g transform="translate(96 392) skewX(-16)">
      <rect width="228" height="46" rx="7" fill="url(#noteDark)"/>
      <rect x="10" y="9" width="208" height="28" rx="4" fill="#fff" opacity=".14"/>
    </g>
    <g transform="translate(112 356) skewX(-16)">
      <rect width="228" height="46" rx="7" fill="url(#note)"/>
      <rect x="10" y="9" width="208" height="28" rx="4" fill="#fff" opacity=".16"/>
    </g>

    <!-- upright note -->
    <g transform="translate(150 168) rotate(-13)">
      <rect width="176" height="238" rx="12" fill="url(#note)"/>
      <rect x="12" y="12" width="152" height="214" rx="8" fill="none"
            stroke="#fff" stroke-opacity=".38" stroke-width="2" stroke-dasharray="8 7"/>
      <circle cx="88" cy="119" r="46" fill="#fff" opacity=".94"/>
      <text x="88" y="140" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif"
            font-size="62" font-weight="700" fill="#1E6BFF">&#8377;</text>
    </g>
  </g>

  <!-- floating chips -->
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">
    <g transform="translate(48 118)">
      <rect width="132" height="44" rx="22" fill="#fff" stroke="#E2E8F0"/>
      <circle cx="26" cy="22" r="9" fill="#10B981"/>
      <path d="M22 22l3 3.5 6-7" fill="none" stroke="#fff" stroke-width="2.4"
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="45" y="27" fill="#0F172A">Approved</text>
    </g>
    <g transform="translate(468 500)">
      <rect width="150" height="44" rx="22" fill="#fff" stroke="#E2E8F0"/>
      <circle cx="26" cy="22" r="9" fill="url(#brand)"/>
      <text x="45" y="27" fill="#0F172A">In 10 mins</text>
    </g>
  </g>
</svg>
